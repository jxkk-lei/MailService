{% load static %}
<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#5146d9">
        <title>{% block title %}MailService{% endblock %}</title>
        <link rel="icon" href="{% static 'homepage/img/logo.svg' %}" type="image/svg+xml">
        <link rel="stylesheet" href="{% static 'homepage/vendor/bootstrap.min.css' %}">
        <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
        <script src="{% static 'homepage/js/main.js' %}" defer>
        </script>
    </head>
    <body>
        <a class="skip-link" href="#main-content">Перейти к содержимому</a>
        {% include "includes/navigation.html" %}
        <main id="main-content" class="container page-content">
            {% block content %}{% endblock %}
        </main>
        <footer class="site-footer">
            <div class="container footer-inner">
                <span>© <span id="current-year">{% now "Y" %}</span> MailService</span>
                <span>Ваши рассылки. Ваши читатели.</span>
            </div>
        </footer>
    </body>
</html>
