{% extends "base.html" %}

{% block content %}
<h1>Подписки</h1>

<table class="table">
    <thead>
        <tr>
            <th>Пользователь</th>
            <th>Список рассылки</th>
        </tr>
    </thead>
    <tbody>
        {% for item in subscriptions %}
        <tr>
            <td>{{ item.user_name }}</td>
            <td>{{ item.list_name }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">Подписки отсутствуют.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
