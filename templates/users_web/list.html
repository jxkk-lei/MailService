{% extends "base.html" %}

{% block content %}
<h1>Пользователи</h1>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.name }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">Пользователи отсутствуют.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
