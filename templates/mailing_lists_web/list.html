{% extends "base.html" %}

{% block content %}
<h1>Списки рассылок</h1>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Владелец</th>
        </tr>
    </thead>
    <tbody>
        {% for item in mailing_lists %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.owner_name }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Списки рассылок отсутствуют.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
