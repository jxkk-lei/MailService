{% extends "base.html" %}

{% block content %}
<h1>Сообщения</h1>

<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Текст</th>
            <th>Дата</th>
            <th>Список рассылки</th>
        </tr>
    </thead>
    <tbody>
        {% for item in messages %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.text }}</td>
            <td>{{ item.date }}</td>
            <td>{{ item.list_name }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">Сообщения отсутствуют.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
